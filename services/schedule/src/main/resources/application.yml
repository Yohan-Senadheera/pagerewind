spring:
  application:
    name: schedule
  datasource:
    url: jdbc:postgresql://localhost:5432/pagerewind
    username: pagerewind
    password: pagerewind
    hikari:
      schema: schedule
      maximum-pool-size: 10
  flyway:
    schemas: schedule
    default-schema: schedule
  rabbitmq:
    host: localhost
    port: 5672
    username: pagerewind
    password: pagerewind
    publisher-confirm-type: correlated
    listener:
      simple:
        concurrency: 2
        max-concurrency: 4
        prefetch: 20
        default-requeue-rejected: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens must come from this Keycloak realm (the "iss" claim) and be meant for PageRewind ("aud").
          issuer-uri: ${PAGEREWIND_AUTH_ISSUER:http://localhost:8180/realms/pagerewind}
          # Where to fetch the signing keys; inside a cluster this is usually an internal address.
          jwk-set-uri: ${PAGEREWIND_AUTH_JWKS:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
          audiences: pagerewind-api

server:
  port: 8083
  shutdown: graceful

pagerewind:
  schedule:
    events-queue: schedule.incident-events
    delivery-limit: 4
    escalation-batch-size: 50
    escalation-poll-interval-ms: 1000
  messaging:
    publish-timeout: 5s
    outbox:
      batch-size: 50
      poll-interval-ms: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs
