spring:
  application:
    name: capture
  datasource:
    url: jdbc:postgresql://localhost:5432/pagerewind
    username: pagerewind
    password: pagerewind
    hikari:
      schema: capture
      maximum-pool-size: 5
  flyway:
    schemas: capture
    default-schema: capture
  rabbitmq:
    host: localhost
    port: 5672
    username: pagerewind
    password: pagerewind
    publisher-confirm-type: correlated
    listener:
      simple:
        concurrency: 1
        max-concurrency: 2
        prefetch: 5
        default-requeue-rejected: true
  mvc:
    problemdetails:
      enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${PAGEREWIND_AUTH_ISSUER:http://localhost:8180/realms/pagerewind}
          jwk-set-uri: ${PAGEREWIND_AUTH_JWKS:${spring.security.oauth2.resourceserver.jwt.issuer-uri}/protocol/openid-connect/certs}
          audiences: pagerewind-api

server:
  port: 8086
  shutdown: graceful

pagerewind:
  capture:
    record-label: pagerewind.dev/record
    window: 15m
    max-lines-per-container: 2000
    max-buffer-size: 256MB
    deleted-pod-retention: 30m
    change-retention: 7d
    look-back: 1h
    follow-logs: true
    record-changes: true
    max-bundle-size: 5MB
    evidence-retention: 30d
    incidents-queue: capture.incident-events
    delivery-limit: 4
  messaging:
    publish-timeout: 5s
    outbox:
      batch-size: 50
      poll-interval-ms: 500

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  structured:
    format:
      console: ecs
