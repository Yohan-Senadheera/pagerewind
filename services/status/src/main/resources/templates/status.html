<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta http-equiv="refresh" content="60">
    <title th:text="${view.title()}">System status</title>
    <style>
        :root { --ok: #1f7a45; --warn: #b26a00; --down: #b42318; --fg: #1d2430; --muted: #5b6573; --line: #dfe3e8; --bg: #ffffff; }
        @media (prefers-color-scheme: dark) {
            :root { --ok: #4cc38a; --warn: #f0a63a; --down: #f97066; --fg: #e6e9ee; --muted: #9aa4b2; --line: #2b3240; --bg: #12161d; }
        }
        body { margin: 0; background: var(--bg); color: var(--fg); font: 16px/1.5 system-ui, sans-serif; }
        main { max-width: 44rem; margin: 0 auto; padding: 2rem 1rem; }
        h1 { font-size: 1.5rem; margin: 0 0 1rem; }
        .banner { padding: 1rem 1.25rem; border-radius: .5rem; color: #fff; font-weight: 600; margin-bottom: 1.5rem; }
        .OPERATIONAL { --c: var(--ok); } .DEGRADED { --c: var(--warn); } .MAJOR_OUTAGE { --c: var(--down); }
        .banner { background: var(--c); }
        ul { list-style: none; padding: 0; margin: 0; border: 1px solid var(--line); border-radius: .5rem; }
        li { display: flex; justify-content: space-between; gap: 1rem; padding: .85rem 1.25rem; border-top: 1px solid var(--line); }
        li:first-child { border-top: 0; }
        .state { color: var(--c); font-weight: 600; white-space: nowrap; }
        footer { color: var(--muted); font-size: .85rem; margin-top: 1rem; }
        h2 { font-size: 1.1rem; margin: 2rem 0 .75rem; }
        .history li { display: block; }
        .history .when { color: var(--muted); font-size: .9rem; }
        .history .impact { color: var(--c); font-weight: 600; }
    </style>
</head>
<body>
<main>
    <h1 th:text="${view.title()}">System status</h1>
    <div class="banner" th:classappend="${view.overall().name()}"
         th:text="${view.overall().name() == 'OPERATIONAL'} ? 'All systems operational' : ${view.overallLabel()}">All systems operational</div>
    <ul th:if="${!view.services().isEmpty()}">
        <li th:each="s : ${view.services()}" th:classappend="${s.level().name()}">
            <span th:text="${s.service()}">service</span>
            <span class="state" th:text="${s.level().label()}">Operational</span>
        </li>
    </ul>
    <p th:if="${view.services().isEmpty()}">No services are being tracked yet.</p>

    <h2 th:text="'Past ' + ${view.historyDays()} + ' days'">Past 14 days</h2>
    <p th:if="${view.history().isEmpty()}" class="when">No incidents.</p>
    <ul class="history" th:unless="${view.history().isEmpty()}">
        <li th:each="h : ${view.history()}" th:classappend="${h.impact().name()}">
            <div><strong th:text="${h.service()}">checkout</strong> · <span class="impact" th:text="${h.impactLabel()}">Major outage</span></div>
            <div class="when">
                <time class="local" th:datetime="${h.openedAt()}" th:text="${h.openedAt()}">opened</time>
                <span th:if="${h.resolvedAt() != null}">
                    – <time class="local" th:datetime="${h.resolvedAt()}" th:text="${h.resolvedAt()}">resolved</time>
                    (<span th:text="${h.duration()}">16 minutes</span>)
                </span>
                <span th:if="${h.resolvedAt() == null}">· ongoing</span>
            </div>
        </li>
    </ul>
    <footer>Updated <time th:datetime="${view.generatedAt()}" th:text="${view.generatedAt()}">now</time>. This page refreshes every minute.</footer>
</main>
<script>
    // Show times in the reader's own time zone; the server sends UTC.
    document.querySelectorAll('time.local').forEach(function (t) {
        var d = new Date(t.getAttribute('datetime'));
        if (!isNaN(d)) {
            t.title = t.getAttribute('datetime');
            t.textContent = d.toLocaleString(undefined, {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit',
                timeZoneName: 'short'});
        }
    });
</script>
</body>
</html>
