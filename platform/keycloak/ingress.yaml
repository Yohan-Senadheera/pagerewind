# Public paths only: the pagerewind realm (logins, tokens, keys) and the login page's styles.
# The master realm, the admin console and the admin API stay inside the cluster; open them with:
#   kubectl -n keycloak port-forward svc/keycloak-service 8180:8080   (then http://localhost:8180/admin)
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  tls:
    - hosts:
        - auth.pagerewind.dev
      secretName: keycloak-tls
  rules:
    - host: auth.pagerewind.dev
      http:
        paths:
          - path: /realms/pagerewind/
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8080
          - path: /resources/
            pathType: Prefix
            backend:
              service:
                name: keycloak-service
                port:
                  number: 8080
