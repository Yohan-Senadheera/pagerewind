# keycloak-clients (client secrets and the app URL for the realm import) from AWS Secrets Manager.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-clients
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: keycloak-clients
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: pagerewind/keycloak-clients
