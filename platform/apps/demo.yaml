# Demo workload for the flight recorder. The namespace is labelled so capture records its logs.
# selfHeal is off so a deliberate bad deploy (demo.ps1 bad-deploy) is not undone by Argo CD.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: demo
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Yohan-Senadheera/pagerewind.git
    targetRevision: main
    path: platform/demo
  destination:
    server: https://kubernetes.default.svc
    namespace: demo
  syncPolicy:
    automated:
      prune: true
      selfHeal: false
    syncOptions:
      - CreateNamespace=true
    managedNamespaceMetadata:
      labels:
        pagerewind.dev/record: "true"
