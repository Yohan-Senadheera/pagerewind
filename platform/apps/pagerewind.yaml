apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: pagerewind
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Yohan-Senadheera/pagerewind.git
    targetRevision: main
    path: deploy/pagerewind
  destination:
    server: https://kubernetes.default.svc
    namespace: pagerewind
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
    # Every pod in the namespace joins the Istio ambient mesh: traffic between them is mutual TLS
    # through ztunnel (ADR 0010). The pods themselves do not change.
    managedNamespaceMetadata:
      labels:
        istio.io/dataplane-mode: ambient
        # The flight recorder (capture) keeps recent logs of PageRewind's own pods for its self-alerts.
        pagerewind.dev/record: "true"
