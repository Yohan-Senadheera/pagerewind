# Pods in this namespace may not reach the EC2 instance metadata service, so they cannot use the node's
# IAM role (the hop limit is 2 for External Secrets). All other traffic is allowed as before.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-instance-metadata
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: {}
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
            except: ["169.254.169.254/32"]
