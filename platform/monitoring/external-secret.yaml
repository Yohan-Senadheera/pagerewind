# Alertmanager needs PageRewind's ingest token (to send alerts in) and the healthchecks.io ping URL
# (for the Watchdog). Grafana needs its admin login. All from AWS Secrets Manager.
#   pagerewind/app         ingest-token          (already there)
#   pagerewind/monitoring  watchdog-url, grafana-admin-password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-pagerewind
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: alertmanager-pagerewind
    creationPolicy: Owner
  data:
    - secretKey: ingest-token
      remoteRef:
        key: pagerewind/app
        property: ingest-token
    - secretKey: watchdog-url
      remoteRef:
        key: pagerewind/monitoring
        property: watchdog-url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: pagerewind/monitoring
        property: grafana-admin-password
