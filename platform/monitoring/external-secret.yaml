# Alertmanager needs PageRewind's ingest token (to send alerts in) and the healthchecks.io ping URL:
# the Watchdog pings it every minute, and critical alerts about PageRewind itself call <url>/fail, which
# makes healthchecks.io email at once without depending on PageRewind. Grafana needs its admin login.
#   pagerewind/app         ingest-token          (already there)
#   pagerewind/monitoring  watchdog-url, grafana-admin-password
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-pagerewind
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: alertmanager-pagerewind
    creationPolicy: Owner
    template:
      data:
        ingest-token: "{{ .ingestToken }}"
        watchdog-url: "{{ .watchdogUrl }}"
        watchdog-fail-url: "{{ .watchdogUrl }}/fail"
  data:
    - secretKey: ingestToken
      remoteRef:
        key: pagerewind/app
        property: ingest-token
    - secretKey: watchdogUrl
      remoteRef:
        key: pagerewind/monitoring
        property: watchdog-url
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: grafana-admin
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: grafana-admin
    creationPolicy: Owner
    template:
      data:
        admin-user: admin
        admin-password: "{{ .password }}"
  data:
    - secretKey: password
      remoteRef:
        key: pagerewind/monitoring
        property: grafana-admin-password
