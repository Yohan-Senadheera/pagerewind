# The database password (pagerewind/app) and the bucket name (pagerewind/backup, written by Terraform).
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: backup
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: backup
    creationPolicy: Owner
  data:
    - secretKey: PGPASSWORD
      remoteRef:
        key: pagerewind/app
        property: postgres-password
    - secretKey: BUCKET
      remoteRef:
        key: pagerewind/backup
        property: bucket
