# Canary check used by PageRewind rollouts: the share of the canary pods' HTTP requests that ended in a
# server error (5xx), from Prometheus, measured every 30 seconds for 2 minutes. One bad measurement
# (above 5%) fails the analysis and the rollout aborts. With no traffic at all the error rate counts as
# 0; the release then relies on readiness probes, so the rollout test sends traffic (see the runbook).
apiVersion: argoproj.io/v1alpha1
kind: ClusterAnalysisTemplate
metadata:
  name: http-error-rate
spec:
  args:
    - name: service
    - name: canary-hash
  metrics:
    - name: error-rate
      interval: 30s
      count: 4
      failureLimit: 0
      successCondition: result[0] <= 0.05
      provider:
        prometheus:
          address: http://monitoring-kube-prometheus-prometheus.monitoring.svc:9090
          query: |
            (
              sum(rate(http_server_requests_seconds_count{namespace="pagerewind", service="{{args.service}}", pod_template_hash="{{args.canary-hash}}", status=~"5..", uri!~"/actuator.*"}[1m]))
              /
              sum(rate(http_server_requests_seconds_count{namespace="pagerewind", service="{{args.service}}", pod_template_hash="{{args.canary-hash}}", uri!~"/actuator.*"}[1m]))
            ) or vector(0)
