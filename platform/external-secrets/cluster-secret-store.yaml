# AWS Secrets Manager in the project's Region. No credentials here: the AWS SDK uses the node's IAM role
# through the instance metadata service (IMDSv2, hop limit 2).
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: aws-secrets-manager
spec:
  provider:
    aws:
      service: SecretsManager
      region: ap-southeast-2
