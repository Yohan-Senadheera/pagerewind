name: Container images

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "libs/**"
      - "services/**"
      - "pom.xml"
      - "Dockerfile"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    name: Build and push to GHCR
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jars (tests run in the Java CI workflow)
        run: ./mvnw -B -ntp -DskipTests package

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push images
        env:
          OWNER: ${{ github.repository_owner }}
          REPOSITORY: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          owner=$(echo "$OWNER" | tr '[:upper:]' '[:lower:]')
          short_sha=${GITHUB_SHA::7}
          for service in gateway ingest incident schedule notify status capture; do
            image="ghcr.io/$owner/pagerewind-$service"
            tags=("$image:sha-$short_sha")
            if [ "$REF_TYPE" = "tag" ]; then
              tags+=("$image:${REF_NAME#v}" "$image:latest")
            else
              tags+=("$image:main")
            fi
            args=()
            for tag in "${tags[@]}"; do args+=(--tag "$tag"); done
            docker build --build-arg SERVICE="$service" \
              --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
              --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.licenses=Apache-2.0" \
              --label "org.opencontainers.image.title=pagerewind-$service" \
              "${args[@]}" .
            for tag in "${tags[@]}"; do docker push "$tag"; done
          done
