name: Container images

# Builds every service image, scans it, pushes it to GHCR, signs it and attaches its SBOM.
#   main  -> sha-<7 chars> and main
#   v*    -> <version>, latest and sha-<7 chars>
# Scanners run from their official images pinned to a version (no third-party actions for them); the one
# action used for signing is pinned to a commit.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "libs/**"
      - "services/**"
      - "pom.xml"
      - "Dockerfile"
      - ".github/workflows/images.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: images-${{ github.ref }}
  cancel-in-progress: false

env:
  TRIVY_IMAGE: aquasec/trivy:0.69.1
  SYFT_IMAGE: anchore/syft:v1.57.2

jobs:
  jars:
    name: Build jars
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jars (tests run in the Java CI workflow)
        run: ./mvnw -B -ntp -DskipTests package

      - uses: actions/upload-artifact@v4
        with:
          name: jars
          path: services/*/target/*.jar
          retention-days: 1

  image:
    name: ${{ matrix.service }}
    needs: jars
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
      # Keyless signing: GitHub issues an OIDC token that Sigstore turns into a short-lived certificate
      # naming this repository and workflow. No signing key is stored anywhere.
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        service: [gateway, ingest, incident, schedule, notify, status, capture]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: jars
          path: services

      - name: Build the image
        env:
          SERVICE: ${{ matrix.service }}
          REPOSITORY: ${{ github.repository }}
        run: |
          docker build --build-arg SERVICE="$SERVICE" \
            --label "org.opencontainers.image.source=https://github.com/$REPOSITORY" \
            --label "org.opencontainers.image.revision=$GITHUB_SHA" \
            --label "org.opencontainers.image.licenses=Apache-2.0" \
            --label "org.opencontainers.image.title=pagerewind-$SERVICE" \
            --tag "candidate/$SERVICE:$GITHUB_SHA" .

      - name: Scan for vulnerabilities (fails on fixable HIGH or CRITICAL)
        env:
          SERVICE: ${{ matrix.service }}
        run: |
          # Exit code 1 means findings and fails at once. Any other failure (seen: the vulnerability
          # database download cut off) is retried, so a network hiccup does not block a release.
          for attempt in 1 2 3; do
            code=0
            docker run --rm -v /var/run/docker.sock:/var/run/docker.sock -v "$HOME/.cache/trivy:/root/.cache/" \
              "$TRIVY_IMAGE" image --scanners vuln --severity HIGH,CRITICAL --ignore-unfixed \
              --exit-code 1 --timeout 15m "candidate/$SERVICE:$GITHUB_SHA" || code=$?
            if [ "$code" -le 1 ]; then exit "$code"; fi
            echo "Scan could not run (exit $code), attempt $attempt of 3"
            sleep $((attempt * 20))
          done
          exit 1

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push
        id: push
        env:
          SERVICE: ${{ matrix.service }}
          REPO_OWNER: ${{ github.repository_owner }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          owner=$(echo "$REPO_OWNER" | tr '[:upper:]' '[:lower:]')
          image="ghcr.io/$owner/pagerewind-$SERVICE"
          tags=("sha-${GITHUB_SHA::7}")
          if [ "$REF_TYPE" = "tag" ]; then tags+=("${REF_NAME#v}" "latest"); else tags+=("main"); fi
          for tag in "${tags[@]}"; do
            docker tag "candidate/$SERVICE:$GITHUB_SHA" "$image:$tag"
            out=$(docker push "$image:$tag")
          done
          # Sign by digest in GHCR. The digest comes from the registry's push reply, so it is the
          # GHCR manifest (RepoDigests can list the local candidate name first).
          digest=$(echo "$out" | grep -oE 'digest: sha256:[0-9a-f]{64}' | cut -d' ' -f2)
          if [ -z "$digest" ]; then echo "No digest in the push output"; exit 1; fi
          echo "ref=$image@$digest" >> "$GITHUB_OUTPUT"
          echo "Pushed $image@$digest as ${tags[*]}"

      - uses: sigstore/cosign-installer@756fe2d284c7292c4e9b62c8a28f1e5629c59532 # v4.1.3
        with:
          cosign-release: v3.1.4

      - name: Sign the image (keyless)
        env:
          REF: ${{ steps.push.outputs.ref }}
        run: cosign sign --yes "$REF"

      - name: SBOM and signed SBOM attestation
        env:
          REF: ${{ steps.push.outputs.ref }}
          SERVICE: ${{ matrix.service }}
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "$SYFT_IMAGE" "$REF" -o spdx-json > "sbom-$SERVICE.spdx.json"
          cosign attest --yes --type spdxjson --predicate "sbom-$SERVICE.spdx.json" "$REF"

      - uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ matrix.service }}
          path: sbom-${{ matrix.service }}.spdx.json
          retention-days: 30

  deploy-pr:
    name: Open the deploy pull request
    # Only for main. Releases (v* tags) are deployed on purpose, not automatically.
    if: github.ref == 'refs/heads/main'
    needs: image
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: deploy-pr
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4

      - name: Point deploy/pagerewind at the new images and open a pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="sha-${GITHUB_SHA::7}"
          scripts/pin-images.sh "$tag" "$GITHUB_REPOSITORY_OWNER"
          if git diff --quiet; then echo "Already on $tag"; exit 0; fi

          branch="deploy-${GITHUB_SHA::7}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git commit -am "Deploy $tag"
          git push origin "$branch"

          cat > body.md <<EOF
          Moves all PageRewind services to \`$tag\` (built from $GITHUB_SHA), pinned by digest.

          Every image passed the Trivy gate, is signed by this repository's images workflow on main,
          and carries a signed SPDX SBOM. Argo CD rolls it out after the merge.

          Opened by the Container images workflow: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID
          EOF
          gh pr create --base main --head "$branch" --title "Deploy $tag" --body-file body.md

          # Older deploy pull requests are now out of date.
          gh pr list --state open --json number,headRefName \
            -q ".[] | select(.headRefName | startswith(\"deploy-\")) | select(.headRefName != \"$branch\") | .number" |
            while read -r old; do
              gh pr close "$old" --delete-branch --comment "Superseded by $tag."
            done
