name: End-to-end

on:
  pull_request:
    paths:
      - "libs/**"
      - "services/**"
      - "pom.xml"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/*.sh"
      - ".github/workflows/e2e.yml"
  push:
    branches: [main]
    paths:
      - "libs/**"
      - "services/**"
      - "pom.xml"
      - "Dockerfile"
      - "docker-compose.yml"
      - ".env.example"
      - "scripts/*.sh"
      - ".github/workflows/e2e.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quickstart:
    name: Compose quickstart
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build jars
        run: ./mvnw -B -ntp -DskipTests package

      - name: Build images
        run: |
          for service in ingest incident schedule notify status; do
            docker build --build-arg SERVICE="$service" -t "local/pagerewind-$service:e2e" .
          done

      - name: Start the quickstart
        run: |
          cp .env.example .env
          for key in POSTGRES_PASSWORD RABBITMQ_PASSWORD INGEST_TOKEN ACTION_LINK_SECRET; do
            sed -i "s/^$key=.*/$key=$(openssl rand -hex 16)/" .env
          done
          sed -i 's/^PAGEREWIND_VERSION=.*/PAGEREWIND_VERSION=e2e/' .env
          echo 'PAGEREWIND_REGISTRY=local' >> .env
          docker compose up -d

      - name: Run the end-to-end test
        run: ./scripts/e2e.sh

      - name: Service logs
        if: failure()
        run: docker compose logs --no-color --tail 200

      - name: Stop
        if: always()
        run: docker compose down -v
