name: Java CI

on:
  push:
    paths:
      - "libs/**"
      - "services/**"
      - "pom.xml"
      - "deploy/keycloak/**"
      - "platform/keycloak/**"
      - "scripts/render-realm-import.py"
      - ".mvn/**"
      - "mvnw"
      - ".github/workflows/java-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: java-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Realm import matches the realm file
        run: python3 scripts/render-realm-import.py --check

      - name: Unit and integration tests (Testcontainers)
        run: ./mvnw -B -ntp verify

      - name: Upload test reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: |
            **/target/surefire-reports/
            **/target/failsafe-reports/
          retention-days: 7
