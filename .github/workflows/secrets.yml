name: Secret scan

# gitleaks over the commits of each pull request or push (not the whole history every time). Reviewed,
# accepted findings are listed by fingerprint in .gitleaksignore.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gitleaks:
    name: gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan new commits
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
        run: |
          range=()   # empty: the whole history
          if [ "$GITHUB_EVENT_NAME" != "workflow_dispatch" ] && [ -n "$BASE" ] \
            && [ "$BASE" != "0000000000000000000000000000000000000000" ]; then
            range=("--log-opts=$BASE..$GITHUB_SHA")
          fi
          docker run --rm -v "$PWD:/repo" -w /repo zricethezav/gitleaks:v8.30.1 \
            git /repo --redact --no-banner --exit-code 1 "${range[@]}"
