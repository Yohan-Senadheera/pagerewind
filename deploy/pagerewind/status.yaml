apiVersion: v1
kind: Service
metadata:
  name: status
spec:
  selector:
    app: status
  ports:
    - port: 80
      targetPort: 8080
---
# A canary release: a new version first gets one of the two pods; Prometheus then checks the error rate
# of that pod for two minutes (platform/rollouts/analysis-templates.yaml). Above 5% the rollout aborts
# and the old version takes all traffic again, with no human action.
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: status
spec:
  replicas: 2
  revisionHistoryLimit: 3
  progressDeadlineSeconds: 600
  progressDeadlineAbort: true
  strategy:
    canary:
      abortScaleDownDelaySeconds: 30
      steps:
        - setWeight: 50
        - pause: {duration: 30s}
        - analysis:
            templates:
              - templateName: http-error-rate
                clusterScope: true
            args:
              - name: service
                value: status
              - name: canary-hash
                valueFrom:
                  podTemplateHashValue: Latest
        - setWeight: 100
  selector:
    matchLabels:
      app: status
  template:
    metadata:
      labels:
        app: status
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: status
          image: ghcr.io/yohan-senadheera/pagerewind-status:0.1.0
          ports:
            - containerPort: 8080
          envFrom:
            - configMapRef:
                name: pagerewind-config
          env:
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pagerewind-secrets
                  key: postgres-password
            - name: SPRING_RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: pagerewind-secrets
                  key: rabbitmq-password
            - name: STATUS_PAGE_TITLE
              value: "PageRewind demo status"
            - name: STATUS_SERVICES
              value: "checkout,payments"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 50m
              memory: 320Mi
            limits:
              memory: 512Mi
          startupProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8080
            periodSeconds: 15
            failureThreshold: 4
          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8080
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
