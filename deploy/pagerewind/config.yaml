# Settings shared by every service. Passwords and tokens are in the Secret "pagerewind-secrets",
# synced from AWS Secrets Manager by External Secrets (external-secret.yaml). Values are generated by
# scripts/demo/new-secrets.ps1 and keycloak-secrets.ps1, then stored with push-secrets-to-aws.ps1.
apiVersion: v1
kind: ConfigMap
metadata:
  name: pagerewind-config
data:
  SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/pagerewind
  SPRING_DATASOURCE_USERNAME: pagerewind
  SPRING_RABBITMQ_HOST: rabbitmq
  SPRING_RABBITMQ_USERNAME: pagerewind
  LOGGING_STRUCTURED_FORMAT_CONSOLE: ecs
  # Tokens name Keycloak by its public address; the services fetch its keys inside the cluster.
  PAGEREWIND_AUTH_ISSUER: https://auth.pagerewind.dev/realms/pagerewind
  PAGEREWIND_AUTH_JWKS: http://keycloak-service.keycloak.svc:8080/realms/pagerewind/protocol/openid-connect/certs
