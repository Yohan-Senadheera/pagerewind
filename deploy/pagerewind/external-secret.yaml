# pagerewind-secrets comes from AWS Secrets Manager (pagerewind/app); every key of that JSON secret
# becomes a key here. To change a value, update it in Secrets Manager (scripts/demo/push-secrets-to-aws.ps1)
# and External Secrets copies it within the refresh interval.
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pagerewind-secrets
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: pagerewind-secrets
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: pagerewind/app
