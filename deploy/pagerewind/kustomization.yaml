apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pagerewind
labels:
  - pairs:
      app.kubernetes.io/part-of: pagerewind
resources:
  - config.yaml
  - postgres.yaml
  - rabbitmq.yaml
  - redis.yaml
  - mailpit.yaml
  - ingest.yaml
  - incident.yaml
  - schedule.yaml
  - notify.yaml
  - status.yaml
  - gateway.yaml
  - capture.yaml
  - external-secret.yaml
  - ingress.yaml
# One version for every PageRewind image. sha-2f82946 is main after #48 (capture, evidence on incidents).
images:
  - name: ghcr.io/yohan-senadheera/pagerewind-gateway
    newTag: sha-2f82946
  - name: ghcr.io/yohan-senadheera/pagerewind-ingest
    newTag: sha-2f82946
  - name: ghcr.io/yohan-senadheera/pagerewind-incident
    newTag: sha-2f82946
  - name: ghcr.io/yohan-senadheera/pagerewind-schedule
    newTag: sha-2f82946
  - name: ghcr.io/yohan-senadheera/pagerewind-notify
    newTag: sha-2f82946
  - name: ghcr.io/yohan-senadheera/pagerewind-status
    newTag: sha-2f82946
  - name: ghcr.io/yohan-senadheera/pagerewind-capture
    newTag: sha-2f82946
