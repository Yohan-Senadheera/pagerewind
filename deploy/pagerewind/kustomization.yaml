apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: pagerewind
labels:
  - pairs:
      app.kubernetes.io/part-of: pagerewind
resources:
  - config.yaml
  - postgres.yaml
  - rabbitmq.yaml
  - redis.yaml
  - mailpit.yaml
  - ingest.yaml
  - incident.yaml
  - schedule.yaml
  - notify.yaml
  - status.yaml
  - gateway.yaml
  - ingress.yaml
  - network-policy.yaml
# One version for every PageRewind image. sha-d4ded3b is main after #27 (logins, roles, gateway).
images:
  - name: ghcr.io/yohan-senadheera/pagerewind-gateway
    newTag: sha-d4ded3b
  - name: ghcr.io/yohan-senadheera/pagerewind-ingest
    newTag: sha-d4ded3b
  - name: ghcr.io/yohan-senadheera/pagerewind-incident
    newTag: sha-d4ded3b
  - name: ghcr.io/yohan-senadheera/pagerewind-schedule
    newTag: sha-d4ded3b
  - name: ghcr.io/yohan-senadheera/pagerewind-notify
    newTag: sha-d4ded3b
  - name: ghcr.io/yohan-senadheera/pagerewind-status
    newTag: sha-d4ded3b
