# Dependencies for running the services locally (not for production).
#   docker compose -f docker-compose.dev.yml up -d
# RabbitMQ management UI: http://localhost:15672 (pagerewind / pagerewind)
name: pagerewind-dev

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: pagerewind
      POSTGRES_USER: pagerewind
      POSTGRES_PASSWORD: pagerewind
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pagerewind -d pagerewind"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 512m

  rabbitmq:
    image: rabbitmq:4.1-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: pagerewind
      RABBITMQ_DEFAULT_PASS: pagerewind
    ports:
      - "127.0.0.1:5672:5672"
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    mem_limit: 512m

  redis:
    image: redis:7.4-alpine
    ports:
      - "127.0.0.1:6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    mem_limit: 128m

volumes:
  postgres-data:
