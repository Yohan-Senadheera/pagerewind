{{- /*
Passwords and tokens. Each value is taken from secrets.values, else kept from the Secret already in the
cluster (so upgrades do not change the database password), else generated. The Secret is kept on
uninstall so a reinstall still matches the data on the volumes.
Note: "helm template" and GitOps tools cannot see the existing Secret and would generate new values on
every render; with them, create the Secret yourself and set secrets.existingSecret.
*/ -}}
{{- if not .Values.secrets.existingSecret }}
{{- $name := include "pagerewind.secretName" . }}
{{- $existing := (lookup "v1" "Secret" .Release.Namespace $name).data | default dict }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "pagerewind.instance" . | nindent 4 }}
  annotations:
    helm.sh/resource-policy: keep
type: Opaque
data:
  {{- $optional := list "telegram-bot-token" "telegram-webhook-secret" }}
  {{- range $key, $given := .Values.secrets.values }}
  {{- if $given }}
  {{ $key }}: {{ $given | b64enc | quote }}
  {{- else if hasKey $existing $key }}
  {{ $key }}: {{ index $existing $key | quote }}
  {{- else if has $key $optional }}
  {{ $key }}: ""
  {{- else }}
  {{ $key }}: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- end }}
{{- end }}
